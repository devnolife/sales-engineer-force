# Dev stack: Gotenberg untuk PDF server-side (M4) + core-ai (service AI terpisah).
# Aplikasi tetap jalan via `pnpm dev` di host; Gotenberg menjangkau app
# lewat host.docker.internal (lihat INTERNAL_APP_URL di .env).
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Service core-ai — repo terpisah (../core-ai). Alternatif: `pnpm dev:ai` di host.
  # Selfhost lokal: gunakan docker-compose.sourcing.yml di backend untuk worker,
  # lalu jalankan core-ai di host via `pnpm dev:ai`. URL loopback hasil setup
  # tidak menunjuk ke host bila core-ai dijalankan di container ini.
  core-ai:
    build: ../core-ai
    env_file:
      - ../core-ai/.env
    ports:
      - "8787:8787"
    environment:
      GOTENBERG_URL: "http://gotenberg:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
