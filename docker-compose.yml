# Dev stack: Gotenberg untuk PDF server-side (M4).
# Aplikasi tetap jalan via `pnpm dev` di host; Gotenberg menjangkau app
# lewat host.docker.internal (lihat INTERNAL_APP_URL di .env).
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
